<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Platformer Asset Pack</title>
<style>
  body{margin:0;background:#12141c;color:#eee;font-family:sans-serif}
  header{position:sticky;top:0;background:#1a1d29;padding:14px 20px;border-bottom:1px solid #333;z-index:5}
  h1{font-size:18px;margin:0 0 6px}
  section{padding:20px}
  h2{font-size:15px;color:#9ab;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px}
  .card{background:#1a1d29;border:1px solid #2c3142;border-radius:8px;padding:10px;text-align:center;width:120px}
  canvas{background:#0e1018;border-radius:4px;display:block;margin:0 auto 8px}
  button{background:#2b3550;color:#fff;border:1px solid #4a5a8a;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px;margin:2px}
  button:hover{background:#3a4770}
  .catbtn{font-size:13px;padding:7px 14px}
</style>
</head>
<body>
<header>
  <h1>Platformer Asset Pack</h1>
  <button class="catbtn" onclick="regenAll()">Regenerate All</button>
  <label style="margin-left:14px;font-size:12px;color:#9ab">
    Palette Hue Lock
    <input type="range" min="0" max="360" value="0" id="hueSlider" oninput="setHueShift(this.value)" style="vertical-align:middle">
    <span id="hueVal">0°</span>
  </label>
</header>

<section>
  <h2>Characters</h2>
  <div class="row" id="characters"></div>
  <h2>Tiles</h2>
  <div class="row" id="tiles"></div>
  <h2>Props</h2>
  <div class="row" id="props"></div>
  <h2>Effects</h2>
  <div class="row" id="effects"></div>
</section>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rint(rng,a,b){return a+Math.floor(rng()*(b-a+1));}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}

// Palette lock: shifts every hue roll by the same amount so a full regenerate
// stays tonally coherent instead of each asset picking a fully independent hue.
let hueShift = 0;
function rhue(rng,a,b){ return shue(rint(rng,a,b)); }
function shue(h){ return ((h%360)+360+hueShift)%360; }
function setHueShift(v){ hueShift = Number(v); document.getElementById('hueVal').textContent = v+'°'; regenAll(); }

function makeCard(container, label, size, drawFn){
  const card = document.createElement('div');
  card.className = 'card';
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  let seed = Math.floor(Math.random()*1e9);
  function render(){ const rng = mulberry32(seed); ctx.clearRect(0,0,size,size); drawFn(ctx, rng, size); }
  render();
  const name = document.createElement('div');
  name.textContent = label; name.style.fontSize='12px'; name.style.marginBottom='6px';
  const rBtn = document.createElement('button');
  rBtn.textContent = '↻'; rBtn.onclick = ()=>{ seed = Math.floor(Math.random()*1e9); render(); };
  const dBtn = document.createElement('button');
  dBtn.textContent = '⬇'; dBtn.onclick = ()=>{
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = label.toLowerCase().replace(/\s+/g,'_')+'.png';
    a.click();
  };
  card.appendChild(canvas); card.appendChild(name); card.appendChild(rBtn); card.appendChild(dBtn);
  container.appendChild(card);
  return render;
}

const renderers = [];
function addAsset(containerId, label, size, drawFn){
  renderers.push(makeCard(document.getElementById(containerId), label, size, drawFn));
}
function regenAll(){ renderers.forEach(r=>r()); }

// ---------- CHARACTERS ----------
function drawHero(ctx, rng, s){
  const shirt = `hsl(${rhue(rng,0,360)},60%,45%)`;
  const skin = `hsl(30,50%,${60+rint(rng,-10,10)}%)`;
  const hairHue = rhue(rng,0,360);
  // cape (behind body)
  ctx.fillStyle = `hsl(${(rhue(rng,0,360))},50%,35%)`;
  ctx.beginPath(); ctx.moveTo(s*0.35,s*0.42); ctx.lineTo(s*0.25,s*0.82); ctx.lineTo(s*0.4,s*0.75); ctx.lineTo(s*0.4,s*0.42); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shirt; ctx.fillRect(s*0.35,s*0.4,s*0.3,s*0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(s*0.35,s*0.4,s*0.3,s*0.06); // shading band
  ctx.fillStyle = skin; ctx.fillRect(s*0.37,s*0.2,s*0.26,s*0.24);
  ctx.fillStyle = `hsl(${hairHue},50%,30%)`; ctx.fillRect(s*0.35,s*0.16,s*0.3,s*0.09);
  ctx.fillStyle = '#222'; ctx.fillRect(s*0.37,s*0.18,s*0.26,s*0.08);
  ctx.fillStyle='#fff'; ctx.fillRect(s*0.41,s*0.28,s*0.04,s*0.03); ctx.fillRect(s*0.55,s*0.28,s*0.04,s*0.03);
  ctx.fillStyle = '#333'; ctx.fillRect(s*0.35,s*0.78,s*0.12,s*0.18); ctx.fillRect(s*0.53,s*0.78,s*0.12,s*0.18);
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1; ctx.strokeRect(s*0.35,s*0.4,s*0.3,s*0.4);
}
function drawEnemySlime(ctx, rng, s){
  const hue = rhue(rng,0,360);
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s*0.5,s*0.84,s*0.28,s*0.06,0,0,Math.PI*2); ctx.fill();
  const grad = ctx.createRadialGradient(s*0.4,s*0.48,2,s*0.5,s*0.6,s*0.34);
  grad.addColorStop(0,`hsl(${hue},70%,60%)`); grad.addColorStop(1,`hsl(${hue},60%,38%)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(s*0.5,s*0.6,s*0.32,s*0.24,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},60%,25%)`; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(s*0.38,s*0.5,s*0.08,s*0.05,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s*0.42,s*0.58,s*0.045,0,Math.PI*2); ctx.arc(s*0.58,s*0.58,s*0.045,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(s*0.42,s*0.58,s*0.02,0,Math.PI*2); ctx.arc(s*0.58,s*0.58,s*0.02,0,Math.PI*2); ctx.fill();
}
function drawEnemyBat(ctx, rng, s){
  const hue = rhue(rng,240,300);
  ctx.strokeStyle=`hsl(${hue},40%,15%)`; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(s*0.4,s*0.45); ctx.quadraticCurveTo(s*0.1,s*0.3,s*0.05,s*0.55); ctx.quadraticCurveTo(s*0.25,s*0.5,s*0.4,s*0.55);
  ctx.moveTo(s*0.6,s*0.45); ctx.quadraticCurveTo(s*0.9,s*0.3,s*0.95,s*0.55); ctx.quadraticCurveTo(s*0.75,s*0.5,s*0.6,s*0.55);
  ctx.fillStyle = `hsl(${hue},40%,25%)`;
  ctx.fill(); ctx.stroke();
  // wing membrane ribs
  ctx.strokeStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.moveTo(s*0.4,s*0.48); ctx.lineTo(s*0.15,s*0.4); ctx.moveTo(s*0.6,s*0.48); ctx.lineTo(s*0.85,s*0.4); ctx.stroke();
  ctx.fillStyle = `hsl(${hue},40%,25%)`;
  ctx.beginPath(); ctx.ellipse(s*0.5,s*0.5,s*0.14,s*0.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsl(${hue},40%,15%)`;
  ctx.beginPath(); ctx.moveTo(s*0.44,s*0.38); ctx.lineTo(s*0.4,s*0.28); ctx.lineTo(s*0.48,s*0.36); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.56,s*0.38); ctx.lineTo(s*0.6,s*0.28); ctx.lineTo(s*0.52,s*0.36); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f33'; ctx.beginPath(); ctx.arc(s*0.45,s*0.48,s*0.02,0,Math.PI*2); ctx.arc(s*0.55,s*0.48,s*0.02,0,Math.PI*2); ctx.fill();
}
function drawPet(ctx, rng, s){
  const hue = rhue(rng,20,240);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s*0.5,s*0.85,s*0.2,s*0.05,0,0,Math.PI*2); ctx.fill();
  // tail
  ctx.strokeStyle=`hsl(${hue},50%,45%)`; ctx.lineWidth=s*0.08; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*0.68,s*0.62); ctx.quadraticCurveTo(s*0.85,s*0.55,s*0.82,s*0.4); ctx.stroke();
  // body
  ctx.fillStyle=`hsl(${hue},50%,50%)`;
  ctx.beginPath(); ctx.ellipse(s*0.48,s*0.62,s*0.22,s*0.16,0,0,Math.PI*2); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(s*0.32,s*0.5,s*0.15,0,Math.PI*2); ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(s*0.22,s*0.42); ctx.lineTo(s*0.2,s*0.28); ctx.lineTo(s*0.3,s*0.38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.38,s*0.4); ctx.lineTo(s*0.4,s*0.26); ctx.lineTo(s*0.44,s*0.38); ctx.closePath(); ctx.fill();
  // belly patch
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(s*0.5,s*0.68,s*0.12,s*0.08,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle=`hsl(${hue},50%,40%)`;
  ctx.fillRect(s*0.36,s*0.74,s*0.06,s*0.1); ctx.fillRect(s*0.56,s*0.74,s*0.06,s*0.1);
  // face
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(s*0.27,s*0.48,s*0.02,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsl(${hue},50%,30%)`; ctx.beginPath(); ctx.arc(s*0.2,s*0.53,s*0.015,0,Math.PI*2); ctx.fill();
}
addAsset('characters','Hero',80,drawHero);
addAsset('characters','Slime Enemy',80,drawEnemySlime);
addAsset('characters','Bat Enemy',80,drawEnemyBat);
addAsset('characters','Pet',80,drawPet);

// ---------- TILES ----------
function drawGroundTile(ctx, rng, s){
  const base = `hsl(${rhue(rng,80,140)},35%,${rint(rng,25,35)}%)`;
  ctx.fillStyle = base; ctx.fillRect(0,0,s,s);
  ctx.fillStyle = `hsl(${rhue(rng,80,140)},35%,${rint(rng,40,50)}%)`; ctx.fillRect(0,0,s,s*0.18);
  // blade-of-grass tufts along the top edge
  ctx.strokeStyle = `hsl(${rhue(rng,90,130)},40%,55%)`; ctx.lineWidth=1.5;
  for(let i=0;i<7;i++){
    const x = rng()*s, h = s*(0.05+rng()*0.06);
    ctx.beginPath(); ctx.moveTo(x,s*0.18); ctx.lineTo(x+(rng()-0.5)*4,s*0.18-h); ctx.stroke();
  }
  ctx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<10;i++) ctx.fillRect(rng()*s,rng()*s,2,2);
  // root/dirt cracks
  ctx.strokeStyle='rgba(0,0,0,0.2)';
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(rng()*s,s*0.4+rng()*s*0.3);
    ctx.lineTo(rng()*s,s*0.6+rng()*s*0.3); ctx.stroke();
  }
}
function drawPlatformTile(ctx, rng, s){
  const wood = `hsl(${rhue(rng,20,40)},45%,${rint(rng,30,45)}%)`;
  ctx.fillStyle = wood; ctx.fillRect(0,0,s,s);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(0,s*(i+1)/4); ctx.lineTo(s,s*(i+1)/4); ctx.stroke(); }
  // wood grain knots + highlight edge
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<3;i++){
    const y = s*(i+0.5)/4;
    ctx.beginPath(); ctx.ellipse(s*(0.2+rng()*0.6), y, s*0.05, s*0.03, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(0,0,s,2);
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.strokeRect(0,0,s,s);
}
function drawStoneTile(ctx, rng, s){
  ctx.fillStyle = `hsl(${rhue(rng,200,220)},8%,${rint(rng,35,45)}%)`; ctx.fillRect(0,0,s,s);
  for(let i=0;i<6;i++){
    ctx.strokeStyle='rgba(0,0,0,0.2)';
    ctx.strokeRect(rng()*s*0.6, rng()*s*0.6, s*0.3, s*0.3);
  }
  // moss patches + speckled cracks for extra texture
  ctx.fillStyle='rgba(80,140,80,0.25)';
  for(let i=0;i<3;i++) ctx.beginPath(), ctx.arc(rng()*s,rng()*s,s*0.06+rng()*s*0.05,0,Math.PI*2), ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(rng()*s,rng()*s); ctx.lineTo(rng()*s,rng()*s); ctx.stroke(); }
}
function drawWaterTile(ctx, rng, s){
  ctx.fillStyle = `hsl(${rhue(rng,200,220)},55%,35%)`; ctx.fillRect(0,0,s,s);
  const grad = ctx.createLinearGradient(0,0,0,s);
  grad.addColorStop(0,'rgba(255,255,255,0.15)'); grad.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,s,s);
  // surface ripple lines
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<3;i++){ const y=rng()*s; ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(s*0.5,y+6,s,y); ctx.stroke(); }
  // foam line along the top edge (water surface meeting air)
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,s*0.08); ctx.lineTo(s,s*0.08); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<5;i++) ctx.fillRect(rng()*s,s*0.05+rng()*4,3,3);
  // sunlight glints deeper in the water
  ctx.fillStyle='rgba(200,230,255,0.4)';
  for(let i=0;i<4;i++) ctx.fillRect(rng()*s,s*0.3+rng()*s*0.6,2,2);
}
addAsset('tiles','Grass Ground',64,drawGroundTile);
addAsset('tiles','Platform',64,drawPlatformTile);
addAsset('tiles','Stone Block',64,drawStoneTile);
addAsset('tiles','Water',64,drawWaterTile);

// ---------- PROPS ----------
function drawBush(ctx, rng, s){
  const hue = rhue(rng,90,140);
  for(let i=0;i<4;i++){
    ctx.fillStyle = `hsl(${hue},45%,${20+rint(rng,-4,8)}%)`;
    ctx.beginPath(); ctx.arc(s*(0.3+rng()*0.4), s*(0.5+rng()*0.3), s*0.18, 0, Math.PI*2); ctx.fill();
  }
  // berries scattered on top + highlight puffs for depth
  ctx.fillStyle = `hsl(${hue},50%,40%)`;
  for(let i=0;i<3;i++) ctx.beginPath(), ctx.arc(s*(0.35+rng()*0.3), s*(0.45+rng()*0.2), s*0.1, 0, Math.PI*2), ctx.fill();
  if(rng() > 0.4){
    ctx.fillStyle = `hsl(${rhue(rng,0,20)},70%,55%)`;
    for(let i=0;i<5;i++) ctx.beginPath(), ctx.arc(s*(0.3+rng()*0.4), s*(0.45+rng()*0.25), s*0.025, 0, Math.PI*2), ctx.fill();
  }
}
function drawRockProp(ctx, rng, s){
  const base = `hsl(${rhue(rng,200,220)},8%,${rint(rng,40,55)}%)`;
  ctx.fillStyle = base;
  ctx.beginPath();
  const n = 7;
  const verts = [];
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const r = s*0.3*(0.7+rng()*0.4);
    const px = s*0.5+Math.cos(a)*r, py = s*0.6+Math.sin(a)*r*0.7;
    verts.push([px,py]);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.stroke();
  // faceted shading: darker lower half, highlight upper-left facet
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.moveTo(verts[0][0],verts[0][1]); ctx.lineTo(verts[1][0],verts[1][1]); ctx.lineTo(s*0.5,s*0.55); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.moveTo(verts[3][0],verts[3][1]); ctx.lineTo(verts[4][0],verts[4][1]); ctx.lineTo(s*0.5,s*0.65); ctx.closePath(); ctx.fill();
}
function drawTreeProp(ctx, rng, s){
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s*0.5,s*0.92,s*0.22,s*0.05,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a2412'; ctx.fillRect(s*0.46,s*0.55,s*0.08,s*0.35);
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.strokeRect(s*0.46,s*0.55,s*0.08,s*0.35);
  const hue = rhue(rng,100,140);
  ctx.fillStyle = `hsl(${hue},45%,${rint(rng,20,32)}%)`;
  ctx.beginPath(); ctx.arc(s*0.5,s*0.4,s*0.3,0,Math.PI*2); ctx.fill();
  // secondary foliage clumps for a fuller canopy + highlight
  ctx.fillStyle = `hsl(${hue},45%,${rint(rng,28,38)}%)`;
  ctx.beginPath(); ctx.arc(s*0.32,s*0.5,s*0.16,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.68,s*0.5,s*0.16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(s*0.4,s*0.28,s*0.1,0,Math.PI*2); ctx.fill();
}
function drawCheckpointFlag(ctx, rng, s){
  const hue = rhue(rng,0,360);
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(s*0.5,s*0.92,s*0.14,s*0.04,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#555'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(s*0.3,s*0.9); ctx.lineTo(s*0.3,s*0.15); ctx.stroke();
  ctx.fillStyle=`hsl(${hue},70%,50%)`;
  ctx.beginPath(); ctx.moveTo(s*0.3,s*0.18); ctx.lineTo(s*0.68,s*0.28); ctx.lineTo(s*0.3,s*0.4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},70%,30%)`; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(s*0.3,s*0.15,s*0.03,0,Math.PI*2); ctx.fill();
}
function drawSpikeHazard(ctx, rng, s){
  const n = 5;
  ctx.fillStyle = `hsl(${rhue(rng,200,220)},10%,${rint(rng,30,45)}%)`;
  for(let i=0;i<n;i++){
    const x0 = s*(i/n), x1 = s*((i+1)/n);
    ctx.beginPath(); ctx.moveTo(x0,s*0.9); ctx.lineTo((x0+x1)/2,s*0.25+rng()*s*0.1); ctx.lineTo(x1,s*0.9); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
  for(let i=0;i<n;i++){
    const x0 = s*(i/n), x1 = s*((i+1)/n);
    ctx.beginPath(); ctx.moveTo(x0,s*0.9); ctx.lineTo((x0+x1)/2,s*0.25); ctx.stroke();
  }
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,s*0.86,s,s*0.06);
}
addAsset('props','Bush',64,drawBush);
addAsset('props','Rock',64,drawRockProp);
addAsset('props','Tree',64,drawTreeProp);
addAsset('props','Checkpoint Flag',64,drawCheckpointFlag);
addAsset('props','Spike Hazard',64,drawSpikeHazard);

// ---------- EFFECTS ----------
function drawCoin(ctx, rng, s){
  const hue = rhue(rng,40,55);
  const grad = ctx.createRadialGradient(s*0.4,s*0.4,2,s*0.5,s*0.5,s*0.35);
  grad.addColorStop(0,`hsl(${hue},90%,75%)`); grad.addColorStop(1,`hsl(${hue},80%,45%)`);
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.32,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},80%,35%)`; ctx.lineWidth=2; ctx.stroke();
  // inner rim ring + emblem for a minted-coin look, plus a glint sparkle
  ctx.strokeStyle=`hsl(${hue},80%,55%)`; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.22,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=`hsl(${hue},70%,40%)`;
  ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.08,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(s*0.3,s*0.3); ctx.lineTo(s*0.38,s*0.38); ctx.stroke();
}
function drawSpark(ctx, rng, s){
  const hue = rhue(rng,30,60);
  // faint radial glow behind the burst
  const glow = ctx.createRadialGradient(s*0.5,s*0.5,0,s*0.5,s*0.5,s*0.4);
  glow.addColorStop(0,`hsla(${hue},100%,70%,0.4)`); glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsl(${hue},100%,70%)`;
  const n = 6;
  for(let i=0;i<n;i++){
    const a = rng()*Math.PI*2, len = s*0.15+rng()*s*0.2;
    ctx.beginPath();
    ctx.arc(s*0.5+Math.cos(a)*len, s*0.5+Math.sin(a)*len, 2+rng()*3, 0, Math.PI*2);
    ctx.fill();
    // trailing streak toward center
    ctx.strokeStyle=`hsla(${hue},100%,80%,0.6)`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(s*0.5,s*0.5); ctx.lineTo(s*0.5+Math.cos(a)*len*0.6, s*0.5+Math.sin(a)*len*0.6); ctx.stroke();
  }
}
function drawDust(ctx, rng, s){
  for(let i=0;i<8;i++){
    ctx.fillStyle=`rgba(200,200,180,${0.2+rng()*0.4})`;
    ctx.beginPath(); ctx.arc(s*0.5+(rng()-0.5)*s*0.6, s*0.6+(rng()-0.5)*s*0.3, 3+rng()*6, 0, Math.PI*2); ctx.fill();
  }
  // small kicked-up debris flecks layered on top for grit
  ctx.fillStyle='rgba(120,100,70,0.5)';
  for(let i=0;i<5;i++) ctx.fillRect(s*0.5+(rng()-0.5)*s*0.7, s*0.55+(rng()-0.5)*s*0.4, 2, 2);
}
function drawHudCounterIcon(ctx, rng, s){
  // rounded badge with a coin glyph, for a HUD coin/score counter
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(s*0.1,s*0.3,s*0.8,s*0.4,s*0.1); ctx.fill();
  const hue = rhue(rng,40,55);
  const grad = ctx.createRadialGradient(s*0.28,s*0.42,1,s*0.3,s*0.5,s*0.16);
  grad.addColorStop(0,`hsl(${hue},90%,75%)`); grad.addColorStop(1,`hsl(${hue},80%,45%)`);
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(s*0.3,s*0.5,s*0.15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},80%,35%)`; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.floor(s*0.22)}px sans-serif`; ctx.textBaseline='middle';
  ctx.fillText('x'+rint(rng,3,99), s*0.5, s*0.51);
}
addAsset('effects','Coin',64,drawCoin);
addAsset('effects','Spark Burst',64,drawSpark);
addAsset('effects','Dust Cloud',64,drawDust);
addAsset('effects','HUD Coin Counter',72,drawHudCounterIcon);
</script>
