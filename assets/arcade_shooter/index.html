<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Shooter Asset Pack</title>
<style>
  body{margin:0;background:#0b0e14;color:#eee;font-family:sans-serif}
  header{position:sticky;top:0;background:#151a26;padding:14px 20px;border-bottom:1px solid #333;z-index:5}
  h1{font-size:18px;margin:0 0 6px}
  section{padding:20px}
  h2{font-size:15px;color:#9ab;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px}
  .card{background:#151a26;border:1px solid #2c3142;border-radius:8px;padding:10px;text-align:center;width:130px}
  canvas{background:#000;border-radius:4px;display:block;margin:0 auto 8px}
  button{background:#2b3550;color:#fff;border:1px solid #4a5a8a;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px;margin:2px}
  button:hover{background:#3a4770}
  .catbtn{font-size:13px;padding:7px 14px}
</style>
</head>
<body>
<header>
  <h1>Arcade Shooter Asset Pack</h1>
  <button class="catbtn" onclick="regenAll()">Regenerate All</button>
  <label style="margin-left:14px;font-size:12px;color:#9ab">
    Palette Hue Lock
    <input type="range" min="0" max="360" value="0" id="hueSlider" oninput="setHueShift(this.value)" style="vertical-align:middle">
    <span id="hueVal">0°</span>
  </label>
</header>
<section>
  <h2>Ships / Characters</h2>
  <div class="row" id="characters"></div>
  <h2>Background Tiles</h2>
  <div class="row" id="tiles"></div>
  <h2>Power-ups / Props</h2>
  <div class="row" id="props"></div>
  <h2>Effects</h2>
  <div class="row" id="effects"></div>
</section>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rint(rng,a,b){return a+Math.floor(rng()*(b-a+1));}
function withAlpha(color, alpha){
  // works for '#rrggbb' or 'hsl(...)' / 'hsla(...)' strings alike
  if(color.startsWith('#')){
    const r=parseInt(color.slice(1,3),16), g=parseInt(color.slice(3,5),16), b=parseInt(color.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  if(color.startsWith('hsl(')) return color.replace('hsl(','hsla(').replace(')',`,${alpha})`);
  if(color.startsWith('hsla(')) return color.replace(/,[^,]+\)$/, `,${alpha})`);
  return color;
}

let hueShift = 0;
function rhue(rng,a,b){ return shue(rint(rng,a,b)); }
function shue(h){ return ((h%360)+360+hueShift)%360; }
function setHueShift(v){ hueShift = Number(v); document.getElementById('hueVal').textContent = v+'°'; regenAll(); }

function makeCard(container, label, size, drawFn){
  const card = document.createElement('div'); card.className='card';
  const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
  const ctx = canvas.getContext('2d');
  let seed = Math.floor(Math.random()*1e9);
  function render(){ const rng = mulberry32(seed); ctx.clearRect(0,0,size,size); drawFn(ctx, rng, size); }
  render();
  const name = document.createElement('div'); name.textContent=label; name.style.fontSize='12px'; name.style.marginBottom='6px';
  const rBtn = document.createElement('button'); rBtn.textContent='↻'; rBtn.onclick=()=>{seed=Math.floor(Math.random()*1e9);render();};
  const dBtn = document.createElement('button'); dBtn.textContent='⬇';
  dBtn.onclick=()=>{ const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=label.toLowerCase().replace(/\s+/g,'_')+'.png'; a.click(); };
  card.appendChild(canvas); card.appendChild(name); card.appendChild(rBtn); card.appendChild(dBtn);
  container.appendChild(card);
  return render;
}
const renderers = [];
function addAsset(id,label,size,fn){ renderers.push(makeCard(document.getElementById(id),label,size,fn)); }
function regenAll(){ renderers.forEach(r=>r()); }

// ---------- SHIPS ----------
function drawPlayerShip(ctx, rng, s){
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  ctx.fillStyle = '#3aa0ff';
  ctx.beginPath(); ctx.moveTo(0,-s*0.35); ctx.lineTo(s*0.25,s*0.3); ctx.lineTo(0,s*0.13); ctx.lineTo(-s*0.25,s*0.3); ctx.closePath(); ctx.fill();
  // wingtip flares + panel line + engine nozzles for readability at a glance
  ctx.fillStyle='#1a5fa0'; ctx.beginPath(); ctx.moveTo(s*0.2,s*0.24); ctx.lineTo(s*0.28,s*0.34); ctx.lineTo(s*0.16,s*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.2,s*0.24); ctx.lineTo(-s*0.28,s*0.34); ctx.lineTo(-s*0.16,s*0.3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,-s*0.3); ctx.lineTo(0,s*0.1); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-s*0.03,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#0a3a6a'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,-s*0.03,s*0.05,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawEnemyFighter(ctx, rng, s){
  const hue = rhue(rng,330,20);
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  ctx.fillStyle = `hsl(${hue},70%,55%)`;
  ctx.beginPath(); ctx.moveTo(0,s*0.22); ctx.lineTo(s*0.19,-s*0.16); ctx.lineTo(0,-s*0.03); ctx.lineTo(-s*0.19,-s*0.16); ctx.closePath(); ctx.fill();
  // wing markings + darker underside shading
  ctx.fillStyle=`hsl(${hue},70%,35%)`;
  ctx.beginPath(); ctx.moveTo(0,s*0.05); ctx.lineTo(s*0.19,-s*0.16); ctx.lineTo(s*0.1,-s*0.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,s*0.05); ctx.lineTo(-s*0.19,-s*0.16); ctx.lineTo(-s*0.1,-s*0.1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `hsl(${hue},70%,75%)`; ctx.beginPath(); ctx.arc(0,-s*0.03,s*0.06,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},70%,30%)`; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
function drawBossShip(ctx, rng, s){
  const hue = rhue(rng,260,320);
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  const segCount = rint(rng,6,9);
  ctx.fillStyle = `hsl(${hue},60%,40%)`;
  ctx.beginPath();
  for(let i=0;i<segCount;i++){
    const a=(i/segCount)*Math.PI*2, r=s*0.3*(0.8+rng()*0.3);
    const px=Math.cos(a)*r, py=Math.sin(a)*r*0.7;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},60%,65%)`; ctx.lineWidth=2; ctx.stroke();
  // armor plating segments + side turret pods flanking the core
  ctx.strokeStyle=`hsl(${hue},60%,25%)`; ctx.lineWidth=1;
  for(let i=0;i<segCount;i++){
    const a=(i/segCount)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*s*0.3, Math.sin(a)*s*0.3*0.7); ctx.stroke();
  }
  ctx.fillStyle=`hsl(${hue},50%,30%)`;
  ctx.beginPath(); ctx.arc(-s*0.28,0,s*0.06,0,Math.PI*2); ctx.arc(s*0.28,0,s*0.06,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsl(${(hue+180)%360},80%,60%)`; ctx.beginPath(); ctx.arc(0,0,s*0.09,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`hsl(${(hue+180)%360},80%,30%)`; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}
function drawPlayerShipTwin(ctx, rng, s){
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  ctx.fillStyle = '#3adf9a';
  // central fuselage
  ctx.beginPath(); ctx.moveTo(0,-s*0.34); ctx.lineTo(s*0.08,s*0.2); ctx.lineTo(0,s*0.3); ctx.lineTo(-s*0.08,s*0.2); ctx.closePath(); ctx.fill();
  // twin outboard hulls with connecting struts
  ctx.fillStyle = '#1a9a5f';
  ctx.beginPath(); ctx.moveTo(s*0.14,-s*0.05); ctx.lineTo(s*0.3,s*0.28); ctx.lineTo(s*0.14,s*0.22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.14,-s*0.05); ctx.lineTo(-s*0.3,s*0.28); ctx.lineTo(-s*0.14,s*0.22); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(s*0.05,s*0.02); ctx.lineTo(s*0.2,s*0.02); ctx.moveTo(-s*0.05,s*0.02); ctx.lineTo(-s*0.2,s*0.02); ctx.stroke();
  ctx.fillStyle='#0a5a35';
  ctx.beginPath(); ctx.arc(s*0.22,s*0.26,s*0.03,0,Math.PI*2); ctx.arc(-s*0.22,s*0.26,s*0.03,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-s*0.02,s*0.045,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawEnemyFighterSwept(ctx, rng, s){
  const hue = rhue(rng,30,60);
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  ctx.fillStyle = `hsl(${hue},70%,50%)`;
  // arrowhead / swept-wing silhouette, distinct from the delta shape
  ctx.beginPath();
  ctx.moveTo(0,s*0.24); ctx.lineTo(s*0.26,-s*0.02); ctx.lineTo(s*0.1,-s*0.1); ctx.lineTo(0,-s*0.2);
  ctx.lineTo(-s*0.1,-s*0.1); ctx.lineTo(-s*0.26,-s*0.02); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},70%,25%)`; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle=`hsl(${hue},70%,32%)`;
  ctx.beginPath(); ctx.moveTo(0,s*0.05); ctx.lineTo(s*0.26,-s*0.02); ctx.lineTo(s*0.14,s*0.0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,s*0.05); ctx.lineTo(-s*0.26,-s*0.02); ctx.lineTo(-s*0.14,s*0.0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `hsl(${hue},70%,72%)`; ctx.beginPath(); ctx.arc(0,-s*0.06,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawEliteEnemy(ctx, rng, s){
  const hue = rhue(rng,180,220);
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  // bulkier gunship silhouette, a size/threat step between fighter and boss
  ctx.fillStyle = `hsl(${hue},60%,42%)`;
  ctx.beginPath();
  ctx.moveTo(0,s*0.3); ctx.lineTo(s*0.16,s*0.05); ctx.lineTo(s*0.3,-s*0.08); ctx.lineTo(s*0.1,-s*0.22);
  ctx.lineTo(0,-s*0.14); ctx.lineTo(-s*0.1,-s*0.22); ctx.lineTo(-s*0.3,-s*0.08); ctx.lineTo(-s*0.16,s*0.05);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=`hsl(${hue},60%,20%)`; ctx.lineWidth=1.5; ctx.stroke();
  // twin gun pods + armored core plate
  ctx.fillStyle=`hsl(${hue},60%,28%)`;
  ctx.fillRect(s*0.22,-s*0.06,s*0.08,s*0.22); ctx.fillRect(-s*0.3,-s*0.06,s*0.08,s*0.22);
  ctx.fillStyle=`hsl(${hue},50%,55%)`;
  ctx.beginPath(); ctx.moveTo(-s*0.08,-s*0.02); ctx.lineTo(s*0.08,-s*0.02); ctx.lineTo(s*0.05,s*0.14); ctx.lineTo(-s*0.05,s*0.14); ctx.closePath(); ctx.fill();
  ctx.fillStyle=`hsl(${(hue+180)%360},80%,60%)`; ctx.beginPath(); ctx.arc(0,-s*0.1,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
addAsset('characters','Player Ship',80,drawPlayerShip);
addAsset('characters','Player Ship (Twin)',80,drawPlayerShipTwin);
addAsset('characters','Enemy Fighter',80,drawEnemyFighter);
addAsset('characters','Enemy Fighter (Swept)',80,drawEnemyFighterSwept);
addAsset('characters','Elite Enemy',88,drawEliteEnemy);
addAsset('characters','Boss',96,drawBossShip);

// ---------- BACKGROUND TILES ----------
function drawCloudTile(ctx, rng, s){
  ctx.fillStyle='#1e3a6e'; ctx.fillRect(0,0,s,s);
  // vertical light gradient to sell scrolling altitude, drawn under the puffs
  const grad = ctx.createLinearGradient(0,0,0,s);
  grad.addColorStop(0,'rgba(255,255,255,0.06)'); grad.addColorStop(1,'rgba(0,0,0,0.1)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<4;i++) ctx.beginPath(), ctx.arc(rng()*s,rng()*s,s*0.12+rng()*s*0.08,0,Math.PI*2), ctx.fill();
  // shadow underside on each puff for volume
  ctx.fillStyle='rgba(150,180,220,0.3)';
  for(let i=0;i<2;i++) ctx.beginPath(), ctx.arc(rng()*s,rng()*s+3,s*0.08+rng()*s*0.05,0,Math.PI*2), ctx.fill();
}
function drawGroundTile(ctx, rng, s){
  ctx.fillStyle = `hsl(${rhue(rng,90,120)},30%,${rint(rng,15,25)}%)`; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='rgba(0,0,0,0.2)';
  for(let i=0;i<10;i++) ctx.fillRect(rng()*s,rng()*s,2,2);
  // winding river/road ribbon + tiny building blocks for a top-down scrolling feel
  ctx.strokeStyle='rgba(80,100,140,0.5)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,rng()*s); ctx.quadraticCurveTo(s*0.5,rng()*s,s,rng()*s); ctx.stroke();
  ctx.fillStyle='rgba(60,60,60,0.5)';
  for(let i=0;i<3;i++) ctx.fillRect(rng()*s,rng()*s,4,4);
}
addAsset('tiles','Cloud Layer',56,drawCloudTile);
addAsset('tiles','Terrain Below',56,drawGroundTile);

// ---------- POWER-UPS ----------
function drawPowerup(kind, color){
  return function(ctx, rng, s){
    ctx.save(); ctx.translate(s*0.5,s*0.5);
    // outer glow halo behind the hex badge
    const glow = ctx.createRadialGradient(0,0,0,0,0,s*0.4);
    glow.addColorStop(0,withAlpha(color,0.33)); glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,s*0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=(i/6)*Math.PI*2; const px=Math.cos(a)*s*0.28, py=Math.sin(a)*s*0.28; if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.stroke();
    // inner icon glyph distinguishing the pickup type
    ctx.fillStyle='rgba(255,255,255,0.9)';
    if(kind==='shield'){ ctx.beginPath(); ctx.moveTo(0,-s*0.12); ctx.lineTo(s*0.1,-s*0.05); ctx.lineTo(s*0.1,s*0.08); ctx.lineTo(0,s*0.14); ctx.lineTo(-s*0.1,s*0.08); ctx.lineTo(-s*0.1,-s*0.05); ctx.closePath(); ctx.fill(); }
    else if(kind==='weapon'){ ctx.fillRect(-s*0.02,-s*0.12,s*0.04,s*0.24); ctx.fillRect(-s*0.08,-s*0.02,s*0.16,s*0.04); }
    else { ctx.fillRect(-s*0.1,-s*0.03,s*0.2,s*0.06); ctx.fillRect(-s*0.03,-s*0.1,s*0.06,s*0.2); }
    ctx.restore();
  }
}
addAsset('props','Shield Pickup',56,drawPowerup('shield','#4ad0ff'));
addAsset('props','Weapon Pickup',56,drawPowerup('weapon','#ff5a5a'));
addAsset('props','Health Pickup',56,drawPowerup('health','#5aff8a'));

// ---------- EFFECTS ----------
function drawBullet(ctx, rng, s){
  ctx.fillStyle='#ffe27a'; ctx.fillRect(s*0.46,s*0.2,s*0.08,s*0.5);
  ctx.shadowColor='#ffe27a'; ctx.shadowBlur=6; ctx.fillRect(s*0.46,s*0.2,s*0.08,s*0.5);
  // bright tip + fading tail streak for a sense of motion
  ctx.shadowBlur=0; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(s*0.5,s*0.2,s*0.05,0,Math.PI*2); ctx.fill();
  const trail = ctx.createLinearGradient(0,s*0.7,0,s);
  trail.addColorStop(0,'rgba(255,226,122,0.6)'); trail.addColorStop(1,'transparent');
  ctx.fillStyle=trail; ctx.fillRect(s*0.47,s*0.7,s*0.06,s*0.3);
}
function drawMissile(ctx, rng, s){
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  // exhaust trail
  const trail = ctx.createLinearGradient(0,s*0.1,0,s*0.4);
  trail.addColorStop(0,'rgba(255,150,60,0.8)'); trail.addColorStop(1,'transparent');
  ctx.fillStyle=trail;
  ctx.beginPath(); ctx.moveTo(-s*0.05,s*0.1); ctx.lineTo(s*0.05,s*0.1); ctx.lineTo(0,s*0.4); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle='#ccc';
  ctx.fillRect(-s*0.05,-s*0.28,s*0.1,s*0.36);
  ctx.beginPath(); ctx.moveTo(-s*0.05,-s*0.28); ctx.lineTo(0,-s*0.42); ctx.lineTo(s*0.05,-s*0.28); ctx.closePath(); ctx.fill();
  // fins
  ctx.fillStyle='#888';
  ctx.beginPath(); ctx.moveTo(-s*0.05,s*0.02); ctx.lineTo(-s*0.14,s*0.12); ctx.lineTo(-s*0.05,s*0.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.05,s*0.02); ctx.lineTo(s*0.14,s*0.12); ctx.lineTo(s*0.05,s*0.1); ctx.closePath(); ctx.fill();
  // guidance stripe + nose tip color
  ctx.fillStyle='#e0453f'; ctx.fillRect(-s*0.05,-s*0.05,s*0.1,s*0.06);
  ctx.fillStyle='#a33'; ctx.beginPath(); ctx.moveTo(-s*0.05,-s*0.28); ctx.lineTo(0,-s*0.42); ctx.lineTo(s*0.05,-s*0.28); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawBomb(ctx, rng, s){
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  // falling motion blur streak above
  const streak = ctx.createLinearGradient(0,-s*0.4,0,-s*0.1);
  streak.addColorStop(0,'transparent'); streak.addColorStop(1,'rgba(255,255,255,0.3)');
  ctx.fillStyle=streak; ctx.fillRect(-s*0.02,-s*0.4,s*0.04,s*0.3);
  // body
  const hue = rhue(rng,0,20);
  const grad = ctx.createRadialGradient(-s*0.05,-s*0.05,2,0,0,s*0.2);
  grad.addColorStop(0,`hsl(${hue},20%,35%)`); grad.addColorStop(1,`hsl(${hue},20%,12%)`);
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(0,0,s*0.17,s*0.2,0,0,Math.PI*2); ctx.fill();
  // tail fins
  ctx.fillStyle=`hsl(${hue},20%,20%)`;
  ctx.beginPath(); ctx.moveTo(-s*0.1,s*0.14); ctx.lineTo(-s*0.2,s*0.28); ctx.lineTo(-s*0.04,s*0.2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.1,s*0.14); ctx.lineTo(s*0.2,s*0.28); ctx.lineTo(s*0.04,s*0.2); ctx.closePath(); ctx.fill();
  // warning stripe + highlight
  ctx.fillStyle='#e0c020'; ctx.fillRect(-s*0.17,-s*0.03,s*0.34,s*0.05);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-s*0.06,-s*0.08,s*0.05,s*0.08,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawExplosion(ctx, rng, s){
  for(let i=0;i<3;i++){
    const grad = ctx.createRadialGradient(s*0.5,s*0.5,0,s*0.5,s*0.5,s*0.4*(1-i*0.25));
    grad.addColorStop(0, i===0?'#fff':(i===1?'#ffcf5a':'#ff5a3a'));
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.4*(1-i*0.25),0,Math.PI*2); ctx.fill();
  }
  // radiating spike flares + smoke puffs drifting off the blast
  ctx.strokeStyle='rgba(255,200,120,0.7)'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const a=rng()*Math.PI*2, len=s*0.35+rng()*s*0.1;
    ctx.beginPath(); ctx.moveTo(s*0.5,s*0.5); ctx.lineTo(s*0.5+Math.cos(a)*len, s*0.5+Math.sin(a)*len); ctx.stroke();
  }
  ctx.fillStyle='rgba(80,80,80,0.3)';
  for(let i=0;i<3;i++) ctx.beginPath(), ctx.arc(s*0.5+(rng()-0.5)*s*0.5, s*0.5+(rng()-0.5)*s*0.5, s*0.05+rng()*s*0.05, 0, Math.PI*2), ctx.fill();
}
function drawEngineTrail(ctx, rng, s){
  const grad = ctx.createLinearGradient(0,0,0,s);
  grad.addColorStop(0,'rgba(120,200,255,0.9)'); grad.addColorStop(1,'rgba(120,200,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.moveTo(s*0.4,0); ctx.lineTo(s*0.6,0); ctx.lineTo(s*0.5,s*0.9); ctx.closePath(); ctx.fill();
  // flickering inner white-hot core + drifting side sparks
  const core = ctx.createLinearGradient(0,0,0,s*0.6);
  core.addColorStop(0,'rgba(255,255,255,0.9)'); core.addColorStop(1,'transparent');
  ctx.fillStyle=core;
  ctx.beginPath(); ctx.moveTo(s*0.46,0); ctx.lineTo(s*0.54,0); ctx.lineTo(s*0.5,s*0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(150,210,255,0.7)';
  for(let i=0;i<4;i++) ctx.beginPath(), ctx.arc(s*0.5+(rng()-0.5)*s*0.2, rng()*s*0.7, 1+rng()*1.5, 0, Math.PI*2), ctx.fill();
}
function drawDamageFlash(ctx, rng, s){
  // ship silhouette placeholder tinted white-hot to show a hit-flash overlay
  ctx.save(); ctx.translate(s*0.5,s*0.5);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.moveTo(0,-s*0.3); ctx.lineTo(s*0.22,s*0.26); ctx.lineTo(0,s*0.12); ctx.lineTo(-s*0.22,s*0.26); ctx.closePath(); ctx.fill();
  ctx.restore();
  // red impact burst + radiating hit sparks over the flash
  const grad = ctx.createRadialGradient(s*0.5,s*0.5,0,s*0.5,s*0.5,s*0.3);
  grad.addColorStop(0,'rgba(255,60,40,0.7)'); grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,200,180,0.8)'; ctx.lineWidth=1.5;
  for(let i=0;i<5;i++){
    const a=rng()*Math.PI*2, len=s*0.15+rng()*s*0.15;
    ctx.beginPath(); ctx.moveTo(s*0.5,s*0.5); ctx.lineTo(s*0.5+Math.cos(a)*len, s*0.5+Math.sin(a)*len); ctx.stroke();
  }
}
addAsset('effects','Bullet',56,drawBullet);
addAsset('effects','Missile',56,drawMissile);
addAsset('effects','Bomb',56,drawBomb);
addAsset('effects','Explosion',56,drawExplosion);
addAsset('effects','Engine Trail',56,drawEngineTrail);
addAsset('effects','Damage Flash',64,drawDamageFlash);
