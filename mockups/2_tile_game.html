<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2D Tile Game Mockup</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;color:#eee;font-family:sans-serif;overflow:hidden}
  #ui{position:fixed;top:10px;left:10px;z-index:10}
  button{background:#2b3550;color:#fff;border:1px solid #4a5a8a;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
  button:hover{background:#3a4770}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui"><button onclick="regenerate()">Regenerate</button></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize', ()=>{resize(); draw();});

let seed = 777;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

const TILE = 24;
let cols, rows, grid, rand, props;

function valueNoise2D(rng, cols, rows, scale){
  const gx = Math.ceil(cols/scale)+2, gy = Math.ceil(rows/scale)+2;
  const g = [];
  for(let y=0;y<gy;y++){ const row=[]; for(let x=0;x<gx;x++) row.push(rng()); g.push(row); }
  const out = [];
  for(let y=0;y<rows;y++){
    const rowOut=[];
    for(let x=0;x<cols;x++){
      const fx=x/scale, fy=y/scale;
      const x0=Math.floor(fx), y0=Math.floor(fy);
      const tx=fx-x0, ty=fy-y0;
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      const v00=g[y0][x0], v10=g[y0][x0+1], v01=g[y0+1][x0], v11=g[y0+1][x0+1];
      const a=v00*(1-sx)+v10*sx, b=v01*(1-sx)+v11*sx;
      rowOut.push(a*(1-sy)+b*sy);
    }
    out.push(rowOut);
  }
  return out;
}

const COLORS = {
  water: '#2a5d8a',
  waterDeep: '#1c3f60',
  sand: '#d8c07a',
  grass: '#4a8a3a',
  grassDark: '#3a7030',
  forest: '#1f5228',
};

function biomeFor(v, m){
  if(v < 0.32) return v < 0.22 ? 'waterDeep' : 'water';
  if(v < 0.38) return 'sand';
  if(m > 0.62) return 'forest';
  return (v+m) % 0.2 < 0.1 ? 'grassDark' : 'grass';
}

function generate(){
  rand = mulberry32(seed);
  cols = Math.ceil(canvas.width/TILE);
  rows = Math.ceil(canvas.height/TILE);
  const elevation = valueNoise2D(rand, cols, rows, 10);
  const moisture = valueNoise2D(mulberry32(seed+999), cols, rows, 14);
  grid = [];
  for(let y=0;y<rows;y++){
    const row=[];
    for(let x=0;x<cols;x++) row.push(biomeFor(elevation[y][x], moisture[y][x]));
    grid.push(row);
  }

  // prop layer: trees/rocks/flowers scattered based on biome, seeded per-tile
  props = [];
  const propRand = mulberry32(seed+2024);
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const b = grid[y][x];
      const roll = propRand();
      if(b==='forest' && roll > 0.35) props.push({x,y,type:'tree'});
      else if(b==='grass' && roll > 0.9) props.push({x,y,type:'rock'});
      else if(b==='grass' && roll < 0.06) props.push({x,y,type:'flower', hue: Math.floor(propRand()*360)});
    }
  }
}

function draw(){
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const b = grid[y][x];
      ctx.fillStyle = COLORS[b];
      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
      // simple texture speckle
      if(b==='grass' || b==='forest'){
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        if((x+y)%3===0) ctx.fillRect(x*TILE+4, y*TILE+4, 3,3);
      }
      if(b==='water' || b==='waterDeep'){
        ctx.fillStyle='rgba(255,255,255,0.08)';
        if((x*7+y*13)%9===0) ctx.fillRect(x*TILE+6,y*TILE+10,6,2);
      }
    }
  }
  // subtle grid lines
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  for(let x=0;x<=cols;x++){ ctx.beginPath(); ctx.moveTo(x*TILE,0); ctx.lineTo(x*TILE,rows*TILE); ctx.stroke(); }
  for(let y=0;y<=rows;y++){ ctx.beginPath(); ctx.moveTo(0,y*TILE); ctx.lineTo(cols*TILE,y*TILE); ctx.stroke(); }

  // prop layer (trees/rocks/flowers) drawn on top of tiles
  for(const p of props){
    const cx = p.x*TILE + TILE/2, cy = p.y*TILE + TILE/2;
    if(p.type === 'tree'){
      ctx.fillStyle = '#4a301a';
      ctx.fillRect(cx-2, cy-2, 4, 8);
      ctx.fillStyle = '#154a1a';
      ctx.beginPath();
      ctx.arc(cx, cy-6, 8, 0, Math.PI*2);
      ctx.fill();
    } else if(p.type === 'rock'){
      ctx.fillStyle = '#8a8a86';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 6, 4, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.ellipse(cx-2,cy-1,2,1,0,0,Math.PI*2); ctx.fill();
    } else if(p.type === 'flower'){
      ctx.fillStyle = `hsl(${p.hue}, 70%, 65%)`;
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff8c0';
      ctx.beginPath(); ctx.arc(cx, cy, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }
}

function regenerate(){
  seed = Math.floor(Math.random()*1e9);
  generate();
  draw();
}

generate();
draw();
</script>
</body>
</html>
