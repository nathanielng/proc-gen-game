<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Sim Mockup</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#eee;font-family:sans-serif;overflow:hidden}
  #ui{position:fixed;top:10px;left:10px;z-index:10}
  button{background:#2b3550;color:#fff;border:1px solid #4a5a8a;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
  button:hover{background:#3a4770}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui"><button onclick="regenerate()">Regenerate</button></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize', ()=>{resize(); draw();});

let seed = 42;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

let rand;
let starLayers, planets, ship, asteroids;

function genStars(rng, count, w, h){
  const stars = [];
  for(let i=0;i<count;i++){
    stars.push({x:rng()*w, y:rng()*h, r: rng()*1.6+0.3, tw: rng()*Math.PI*2});
  }
  return stars;
}

function planetColorSet(rng){
  const hues = [200,20,140,280,40,320];
  const h = hues[Math.floor(rng()*hues.length)];
  return {
    base: `hsl(${h}, 55%, 35%)`,
    dark: `hsl(${h}, 55%, 20%)`,
    light: `hsl(${h}, 55%, 50%)`,
    ring: `hsla(${(h+40)%360}, 40%, 70%, 0.5)`
  };
}

function generate(){
  rand = mulberry32(seed);
  const w = canvas.width, h = canvas.height;
  starLayers = [
    genStars(rand, 120, w, h),
    genStars(rand, 80, w, h),
    genStars(rand, 40, w, h),
  ];

  const planetCount = 2 + Math.floor(rand()*3);
  planets = [];
  for(let i=0;i<planetCount;i++){
    const colors = planetColorSet(rand);
    planets.push({
      x: rand()*w,
      y: rand()*h*0.8 + h*0.05,
      r: 30 + rand()*70,
      colors,
      hasRing: rand() > 0.5,
      craterSeed: rand()*1000
    });
  }

  ship = { x: w*0.5, y: h*0.85, r: rand() };

  // asteroid belt: a diagonal drifting band of irregular rocks
  asteroids = [];
  const beltAngle = -0.3 + rand()*0.2;
  const beltY = h*0.55 + (rand()-0.5)*h*0.2;
  const count = 14 + Math.floor(rand()*14);
  for(let i=0;i<count;i++){
    const t = rand();
    const r = 4 + rand()*14;
    const verts = 6 + Math.floor(rand()*3);
    const jitter = Array.from({length: verts}, ()=> 0.6+rand()*0.5);
    asteroids.push({
      x: t*w*1.4 - w*0.2,
      y: beltY + Math.sin(t*Math.PI*2)*40 + (rand()-0.5)*60,
      r, jitter, speed: 8+rand()*20, angle: beltAngle, rot: rand()*Math.PI*2, rotSpeed: (rand()-0.5)*0.6
    });
  }
}

function drawStars(){
  const w=canvas.width,h=canvas.height;
  const t = Date.now()/600;
  starLayers.forEach((layer, i)=>{
    ctx.fillStyle = `rgba(255,255,255,${0.4+i*0.2})`;
    for(const s of layer){
      const alpha = 0.5 + 0.5*Math.sin(t + s.tw);
      ctx.globalAlpha = 0.3 + alpha*0.7;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

function drawPlanet(p){
  const {x,y,r,colors} = p;
  const grad = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0, colors.light);
  grad.addColorStop(0.6, colors.base);
  grad.addColorStop(1, colors.dark);

  if(p.hasRing){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.3);
    ctx.scale(1,0.35);
    ctx.strokeStyle = colors.ring;
    ctx.lineWidth = r*0.18;
    ctx.beginPath();
    ctx.arc(0,0,r*1.6,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.fillStyle = grad;
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();

  // craters / surface noise
  let cr = mulberry32(Math.floor(p.craterSeed*1000));
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  for(let i=0;i<12;i++){
    const cx = x + (cr()-0.5)*r*1.8;
    const cy = y + (cr()-0.5)*r*1.8;
    const cRad = r*0.06 + cr()*r*0.1;
    ctx.fillStyle = `rgba(0,0,0,${0.1+cr()*0.15})`;
    ctx.beginPath();
    ctx.arc(cx,cy,cRad,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  if(p.hasRing){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.3);
    ctx.scale(1,0.35);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,r*1.1,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawShip(){
  const {x,y} = ship;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = '#c7d0e0';
  ctx.beginPath();
  ctx.moveTo(0,-24);
  ctx.lineTo(14,16);
  ctx.lineTo(0,8);
  ctx.lineTo(-14,16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#3aa0ff';
  ctx.beginPath();
  ctx.ellipse(0,-4,4,8,0,0,Math.PI*2);
  ctx.fill();
  // engine glow
  const glow = ctx.createRadialGradient(0,20,1,0,20,14);
  glow.addColorStop(0,'rgba(255,180,80,0.9)');
  glow.addColorStop(1,'rgba(255,180,80,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,20,14,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawAsteroids(){
  const t = Date.now()/1000;
  ctx.fillStyle = '#8a7d6f';
  for(const a of asteroids){
    const x = ((a.x + t*a.speed*Math.cos(a.angle)) % (canvas.width+100)) - 50;
    const y = a.y + ((t*a.speed*Math.sin(a.angle)) % canvas.height);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a.rot + t*a.rotSpeed);
    ctx.beginPath();
    for(let i=0;i<a.jitter.length;i++){
      const ang = (i/a.jitter.length)*Math.PI*2;
      const rr = a.r*a.jitter[i];
      const px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = '#7a6d5f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.stroke();
    ctx.restore();
  }
}

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawStars();
  for(const p of planets) drawPlanet(p);
  drawAsteroids();
  drawShip();
}

function regenerate(){
  seed = Math.floor(Math.random()*1e9);
  generate();
  draw();
}

generate();
draw();
function loop(){ draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
