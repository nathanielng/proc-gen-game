<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Shooter Mockup</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;color:#eee;font-family:sans-serif;overflow:hidden}
  #ui{position:fixed;top:10px;left:10px;z-index:10}
  button{background:#2b3550;color:#fff;border:1px solid #4a5a8a;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
  button:hover{background:#3a4770}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui"><button onclick="regenerate()">Regenerate</button></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize', ()=>{resize();});

let seed = 314;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

let rand, clouds, enemies, bullets, player, boss, powerups;

function valueNoise2D(rng, cols, rows, scale){
  const gx = Math.ceil(cols/scale)+2, gy = Math.ceil(rows/scale)+2;
  const g = [];
  for(let y=0;y<gy;y++){ const row=[]; for(let x=0;x<gx;x++) row.push(rng()); g.push(row); }
  const out = [];
  for(let y=0;y<rows;y++){
    const rowOut=[];
    for(let x=0;x<cols;x++){
      const fx=x/scale, fy=y/scale;
      const x0=Math.floor(fx), y0=Math.floor(fy);
      const tx=fx-x0, ty=fy-y0;
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      const v00=g[y0][x0], v10=g[y0][x0+1], v01=g[y0+1][x0], v11=g[y0+1][x0+1];
      const a=v00*(1-sx)+v10*sx, b=v01*(1-sx)+v11*sx;
      rowOut.push(a*(1-sy)+b*sy);
    }
    out.push(rowOut);
  }
  return out;
}

function generate(){
  rand = mulberry32(seed);
  const w = canvas.width, h = canvas.height*2; // tall buffer for scroll
  const step = 8;
  const field = valueNoise2D(rand, Math.ceil(w/step), Math.ceil(h/step), 12);
  clouds = { field, step, cols: Math.ceil(w/step), rows: Math.ceil(h/step) };

  // enemy formations: rows of grid-based enemies with random offsets, procedurally placed
  enemies = [];
  const formationCount = 3 + Math.floor(rand()*3);
  for(let f=0; f<formationCount; f++){
    const rows = 1 + Math.floor(rand()*3);
    const cols = 3 + Math.floor(rand()*5);
    const baseY = -200 - f*260 - rand()*100;
    const spacingX = canvas.width/(cols+1);
    const type = rand() > 0.5 ? 'zigzag' : 'grid';
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        enemies.push({
          x: spacingX*(c+1) + (rand()-0.5)*20,
          baseY: baseY - r*50,
          phase: rand()*Math.PI*2,
          type,
          hue: 340 + Math.floor(rand()*40)
        });
      }
    }
  }

  bullets = [];
  for(let i=0;i<10;i++){
    bullets.push({x: rand()*canvas.width, y: rand()*canvas.height, speed: 4+rand()*4});
  }

  player = {x: canvas.width/2, y: canvas.height - 90};

  // boss layer: large procedurally-shaped enemy far up the scroll, plus power-up pickups
  const segCount = 6 + Math.floor(rand()*4);
  boss = {
    baseY: -1400 - rand()*300,
    hue: 260 + Math.floor(rand()*60),
    segments: Array.from({length: segCount}, (_,i)=>({
      angle: (i/segCount)*Math.PI*2,
      r: 40 + rand()*30
    })),
    coreR: 50 + rand()*20
  };

  powerups = [];
  for(let i=0;i<6;i++){
    powerups.push({
      x: 60 + rand()*(canvas.width-120),
      baseY: -rand()*1800,
      kind: ['shield','weapon','health'][Math.floor(rand()*3)],
      phase: rand()*Math.PI*2
    });
  }
}

let scrollY = 0;

function drawBackground(){
  const w = canvas.width, h = canvas.height;
  const sky = ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#0d1b3d');
  sky.addColorStop(1,'#1e3a6e');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,w,h);

  const {field, step, cols, rows} = clouds;
  const offsetRows = Math.floor(scrollY/step) % rows;
  for(let y=0;y<Math.ceil(h/step);y++){
    const fy = (y + offsetRows) % rows;
    for(let x=0;x<cols;x++){
      const v = field[fy][x];
      if(v > 0.55){
        ctx.fillStyle = `rgba(255,255,255,${(v-0.55)*1.2})`;
        ctx.fillRect(x*step, y*step, step, step);
      } else if (v < 0.25){
        ctx.fillStyle = `rgba(30,60,40,${(0.25-v)*1.5})`;
        ctx.fillRect(x*step, y*step, step, step);
      }
    }
  }
}

function drawEnemy(e, t){
  let x = e.x, y = e.baseY + scrollY;
  if(e.type === 'zigzag') x += Math.sin(t*2 + e.phase) * 30;
  if(y < -40 || y > canvas.height+40) return;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = `hsl(${e.hue}, 70%, 55%)`;
  ctx.beginPath();
  ctx.moveTo(0,14);
  ctx.lineTo(12,-10);
  ctx.lineTo(0,-2);
  ctx.lineTo(-12,-10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = `hsl(${e.hue}, 70%, 75%)`;
  ctx.beginPath();
  ctx.arc(0,-2,4,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBoss(t){
  const y = boss.baseY + scrollY;
  if(y < -150 || y > canvas.height+150) return;
  const x = canvas.width/2 + Math.sin(t*0.5)*80;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = `hsl(${boss.hue}, 60%, 40%)`;
  ctx.beginPath();
  boss.segments.forEach((s,i)=>{
    const r = s.r * (1 + Math.sin(t*2+i)*0.05);
    const px = Math.cos(s.angle)*r, py = Math.sin(s.angle)*r*0.7;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `hsl(${boss.hue}, 60%, 65%)`;
  ctx.lineWidth = 3;
  ctx.stroke();
  // core eye
  ctx.fillStyle = `hsl(${(boss.hue+180)%360}, 80%, 60%)`;
  ctx.beginPath(); ctx.arc(0,0, boss.coreR*0.35, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPowerups(t){
  for(const p of powerups){
    const y = p.baseY + scrollY;
    if(y < -20 || y > canvas.height+20) continue;
    const x = p.x + Math.sin(t*2+p.phase)*6;
    ctx.save();
    ctx.translate(x,y);
    const colors = {shield:'#4ad0ff', weapon:'#ff5a5a', health:'#5aff8a'};
    ctx.fillStyle = colors[p.kind];
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = (i/6)*Math.PI*2;
      const px = Math.cos(a)*10, py = Math.sin(a)*10;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = '#3aa0ff';
  ctx.beginPath();
  ctx.moveTo(0,-22);
  ctx.lineTo(16,18);
  ctx.lineTo(0,8);
  ctx.lineTo(-16,18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0,-2,3,0,Math.PI*2); ctx.fill();
  const glow = ctx.createRadialGradient(0,22,1,0,22,14);
  glow.addColorStop(0,'rgba(120,200,255,0.9)');
  glow.addColorStop(1,'rgba(120,200,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,22,14,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawBullets(){
  ctx.fillStyle = '#ffe27a';
  for(const b of bullets){
    ctx.fillRect(b.x-2, b.y, 4, 12);
    b.y -= b.speed;
    if(b.y < -20){ b.y = canvas.height+20; b.x = rand ? rand()*canvas.width : b.x; }
  }
}

let t0 = 0;
function loop(ts){
  const t = ts/1000;
  scrollY += 1.2;
  drawBackground();
  drawPowerups(t);
  for(const e of enemies) drawEnemy(e, t);
  drawBoss(t);
  drawBullets();
  drawPlayer();
  requestAnimationFrame(loop);
}

function regenerate(){
  seed = Math.floor(Math.random()*1e9);
  scrollY = 0;
  generate();
}

generate();
requestAnimationFrame(loop);
</script>
</body>
</html>
